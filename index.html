<!doctype html>
<html lang="en" class="is-locked is-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Coupon Crows ($CAW) · Collecting shiny returns</title>
    <meta
      name="description"
      content="Coupon Crows is a fictional community art project about the patient collector of the flock: the crow that gathers shiny things, coin by coin."
    />
    <meta name="theme-color" content="#020308" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Share cards. Set VITE_SITE_URL in .env so the image URL is absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coupon Crows" />
    <meta property="og:title" content="Coupon Crows ($CAW) · Collecting shiny returns" />
    <meta
      property="og:description"
      content="Every flock needs a mascot. Nobody had drawn the crow. So we did. A fictional community art project."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Coupon Crow mascot, a blue-black crow on a stack of coins with a coin in its beak, next to the words Coupon Crows, collecting shiny returns."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coupon Crows ($CAW) · Collecting shiny returns" />
    <meta
      name="twitter:description"
      content="Every flock needs a mascot. Nobody had drawn the crow. So we did. A fictional community art project."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
  </head>
  <body>
    <!-- The 3D scene. Everything else sits on top of it. -->
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- 0. Loader: counts over heavy static, then the picture flips on -->
    <div class="boot" id="boot" role="status" aria-label="Loading Coupon Crows">
      <span class="brand"><span class="slashes" aria-hidden="true">//////</span> Coupon Crows</span>
      <div class="boot__count" id="bootCount" aria-hidden="true">000</div>
      <p class="boot__status" id="bootStatus">Collecting shiny things…</p>
      <div class="boot__bar" aria-hidden="true"><i id="bootBar"></i></div>
    </div>

    <!-- Entry screen: the hero scene is live behind these buttons -->
    <div class="entry" id="entry" hidden>
      <div class="entry__actions">
        <button class="btn btn--primary" type="button" data-enter="sound">Enter</button>
        <button class="btn" type="button" data-enter="silent">Enter without sound</button>
      </div>
      <p class="entry__hint">Best with sound · change or mute the music from the corner</p>
    </div>

    <div id="site" inert>
      <header class="topbar">
        <a class="brand" href="#crow" id="brandLink" aria-label="Coupon Crows, back to the first screen">
          <span class="slashes" aria-hidden="true">//////</span> <span class="brand__name">Coupon Crows</span>
        </a>
      </header>

      <!-- The twelve screens, rendered from src/screens.ts -->
      <main id="screens"></main>

      <nav class="rail" id="rail" aria-label="Screens"></nav>

      <div class="sound" role="group" aria-label="Music">
        <button class="sound__nav" id="sndPrev" type="button" aria-label="Previous track">‹</button>
        <span class="sound__name" id="sndName" aria-live="polite">Wire at Dusk</span>
        <button class="sound__nav" id="sndNext" type="button" aria-label="Next track">›</button>
        <button class="sound__toggle" id="sndToggle" type="button" aria-pressed="false">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="sndLabel">Music off</span>
        </button>
      </div>

      <div class="progress" aria-hidden="true">
        <span class="progress__num"><b id="progNum">01</b> / <span id="progTotal">12</span></span>
        <span class="progress__sep">·</span>
        <span class="progress__name" id="progName">The crow</span>
      </div>
    </div>

    <dialog class="lightbox" id="lightbox" aria-label="Viewer">
      <div class="lightbox__inner">
        <button class="btn lightbox__close" id="lightboxClose" type="button">Close ✕</button>
        <div class="lightbox__stage" id="lightboxStage"></div>
        <div class="lightbox__bar">
          <button class="btn" id="lightboxPrev" type="button" aria-label="Previous meme">⟵</button>
          <span id="lightboxCaption"></span>
          <button class="btn" id="lightboxNext" type="button" aria-label="Next meme">⟶</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Static and scanlines over the whole page, so the UI matches the picture -->
    <div class="static" aria-hidden="true"></div>
    <div class="cursor" id="cursor" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
